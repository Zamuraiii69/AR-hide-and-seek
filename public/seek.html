<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seek | Meccha Chameleon</title>
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  } }</script>
  <style>
    * { box-sizing: border-box; } html, body { margin:0; width:100%; height:100%; overflow:hidden; position:fixed; overscroll-behavior:none; background:#090b0c; color:#f3f5f2; font:15px system-ui,sans-serif; }
    #ar { position:fixed; inset:0; } #hud { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:14px; }
    /* position+z-index so the HUD stays above the gate overlay: #gate is
       absolutely positioned and would otherwise paint over static siblings. */
    .top, .panel { pointer-events:auto; position:relative; z-index:1; background:rgba(18,23,22,.9); border:1px solid #405047; border-radius:8px; box-shadow:0 5px 18px #0008; }
    .top { align-self:stretch; display:flex; gap:10px; align-items:center; padding:9px 12px; } #status { flex:1; color:#c9d5ca; } .panel { align-self:center; width:min(520px,100%); padding:12px; display:grid; gap:10px; }
    button, a.button { pointer-events:auto; font:inherit; border:0; border-radius:6px; min-height:40px; padding:0 13px; background:#d05e3f; color:white; font-weight:700; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; } button.secondary, a.secondary { background:#324139; } button:disabled { opacity:.5; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .controls button, .controls a.button { flex:1; }
    /* Guess counter: dots empty out as tries are spent. */
    .guesses { display:flex; gap:8px; align-items:center; color:#c9d5ca; } .dots { display:flex; gap:6px; } .dot { width:14px; height:14px; border-radius:50%; background:#e8c27a; border:2px solid #e8c27a; } .dot.spent { background:transparent; border-color:#6b7a70; }
    #result-title { margin:0; font-size:19px; } #result-note, #result-stats { color:#9fb0a3; font-size:13px; }
    /* Distance gate. pointer-events:auto is load-bearing: it swallows taps on the
       camera so a blocked view can never cost the player a guess. It sits before
       .panel in the DOM, so the panel's own buttons stay clickable above it. */
    #gate { position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:auto; background:radial-gradient(circle at 50% 45%, rgba(9,11,12,.5), rgba(9,11,12,.93)); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
    #gate span { background:rgba(18,23,22,.92); border:1px solid #405047; border-radius:8px; padding:10px 15px; }
    [data-gated=true] #gate { display:flex; }
    .ripple { position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:2px solid #f0d9a0; pointer-events:none; animation:ripple .65s ease-out forwards; }
    @keyframes ripple { to { transform:scale(4.5); opacity:0; } }
    [data-mode=LOADING] .panel, [data-mode=READY] .panel { display:none; }
    [data-mode=HUNTING] .result-only, [data-mode=RESULT] .hunt-only { display:none; }
    .spinner { width:16px; height:16px; border:2px solid #fff5; border-top-color:white; border-radius:50%; animation:spin .75s linear infinite; } .hidden { display:none; } @keyframes spin { to { transform:rotate(360deg) } }
  </style>
</head>
<body><div id="ar"></div><div id="hud" data-mode="LOADING" data-gated="false">
  <div class="top"><span id="spinner" class="spinner hidden"></span><span id="status">กำลังโหลดที่ซ่อน…</span><button id="start" type="button" disabled>Start camera</button></div>
  <div id="gate"><span>ถอยออกมาอีกนิด แล้วค่อยมองหา</span></div>
  <section class="panel">
    <div class="hunt-only guesses"><span id="dots" class="dots"></span><span id="guess-label"></span></div>
    <div class="result-only">
      <h2 id="result-title"></h2>
      <p id="result-note"></p>
      <p id="result-stats"></p>
      <div class="controls"><button id="again" class="secondary" type="button">ลองใหม่</button><a id="stats-link" class="button secondary" href="/stats.html">สถิติ</a><a class="button" href="/">หน้าแรก</a></div>
    </div>
  </section>
</div><script type="module" src="/js/seek/seekApp.js"></script></body></html>
