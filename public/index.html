<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AR Hide and Seek</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light;
    --bg: #f5f5f3;
    --panel: #ffffff;
    --line: #e2e3df;
    --text: #16181a;
    --muted: #5f6870;
    --accent: #e44a24;
    --ok: #1d8a4c;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    width: min(960px, 100%);
    margin: 0 auto;
    padding: 24px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 24px;
  }
  .upload-action {
    display: grid;
    justify-items: end;
    gap: 6px;
  }
  .desktop-hint {
    color: var(--muted);
    font-size: .78rem;
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.6rem, 5vw, 2.5rem);
    line-height: 1.05;
  }
  p {
    margin: 0;
    color: var(--muted);
    line-height: 1.5;
  }
  a.button, button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .secondary {
    background: var(--panel);
    border-color: #d2d4cf;
    color: var(--text);
  }
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 18px;
  }
  .notice {
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: .92rem;
    margin-bottom: 18px;
  }
  #markers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    min-height: 270px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  .thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #eceeea;
    object-fit: cover;
    border-bottom: 1px solid var(--line);
  }
  .empty-thumb {
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: .86rem;
  }
  .body {
    padding: 13px;
    display: grid;
    gap: 10px;
    flex: 1;
  }
  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: auto;
  }
  .card-note {
    min-height: 1.3em;
    color: var(--muted);
    font-size: .78rem;
  }
  .name {
    margin: 0;
    font-size: 1rem;
    line-height: 1.25;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--muted);
    font-size: .84rem;
  }
  .status {
    color: var(--ok);
    font-weight: 700;
  }
  .status.pending {
    color: #a35c00;
  }
  .disabled {
    pointer-events: none;
    opacity: .55;
    background: var(--panel) !important;
    border-color: #d2d4cf !important;
    color: var(--text) !important;
  }
  button:disabled {
    cursor: not-allowed;
    opacity: .55;
  }
  .message {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 22px;
    color: var(--muted);
  }
  @media (max-width: 620px) {
    main { padding: 18px; }
    header { display: block; }
    .upload-action { margin-top: 16px; justify-items: stretch; }
    header .button { width: 100%; }
    .toolbar a, .toolbar button { flex: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>AR Hide and Seek</h1>
      <p>เลือก marker เพื่อซ่อนตัวพรางสีบนรูปเดียวกัน</p>
    </div>
    <div class="upload-action">
      <a class="button" href="/upload.html">Upload marker</a>
      <span class="desktop-hint">สร้าง marker บนคอมพิวเตอร์</span>
    </div>
  </header>

  <div class="notice">อัปโหลดรูป Marker ที่มีรายละเอียดชัดเจน แล้วระบบจะเปิดหน้า AR Hide ให้ทดสอบ</div>

  <div class="toolbar">
    <button id="refresh" class="secondary" type="button">Refresh</button>
  </div>

  <section id="markers" aria-live="polite">
    <div class="message">Loading markers...</div>
  </section>
</main>

<script type="module">
import { initializeTopLevelDemoContext } from '/js/demoContext.js';
initializeTopLevelDemoContext();

const markersEl = document.getElementById('markers');
const refreshBtn = document.getElementById('refresh');

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function markerCard(marker) {
  const ready = marker.status === 'ready';
  const hideCount = Number(marker.hideCount || 0);
  const img = marker.imageUrl
    ? `<img class="thumb" src="${marker.imageUrl}" alt="">`
    : '<div class="thumb empty-thumb">No image</div>';
  const actions = ready
    ? `<div class="card-actions">
        <a class="button" href="/hide.html?marker=${marker.id}">Hide here</a>
        <button class="secondary seek-marker" type="button" data-marker-id="${marker.id}"
          ${hideCount ? '' : 'disabled title="ยังไม่มีคนซ่อนใน marker นี้"'}>Find someone</button>
      </div>
      <div class="card-note" data-marker-note="${marker.id}">${hideCount ? '' : 'ยังไม่มีที่ซ่อนให้ค้นหา'}</div>`
    : '<a class="button disabled" aria-disabled="true">Pending</a>';
  return `
    <article class="card">
      ${img}
      <div class="body">
        <h2 class="name">${escapeHtml(marker.name)}</h2>
        <div class="meta">
          <span class="status ${ready ? '' : 'pending'}">${escapeHtml(marker.status)}</span>
          <span>${hideCount} hides</span>
        </div>
        ${actions}
      </div>
    </article>`;
}

async function loadMarkers() {
  markersEl.innerHTML = '<div class="message">Loading markers...</div>';
  try {
    const res = await fetch('/api/markers');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const markers = await res.json();
    markersEl.innerHTML = markers.length
      ? markers.map(markerCard).join('')
      : '<div class="message">No markers yet. Upload a feature-rich image first.</div>';
  } catch (err) {
    markersEl.innerHTML = `<div class="message">Failed to load markers: ${escapeHtml(err.message || err)}</div>`;
  }
}

refreshBtn.addEventListener('click', loadMarkers);
markersEl.addEventListener('click', async (event) => {
  const button = event.target.closest('.seek-marker');
  if (!button || button.disabled) return;
  const markerId = Number(button.dataset.markerId);
  const note = markersEl.querySelector(`[data-marker-note="${markerId}"]`);
  button.disabled = true;
  if (note) note.textContent = 'กำลังเลือกที่ซ่อน...';
  try {
    const res = await fetch(`/api/markers/${markerId}/hides?pick=random&limit=1`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const [hide] = await res.json();
    if (!hide) throw new Error('ยังไม่มีที่ซ่อนให้ค้นหา');
    location.href = `/seek.html?hide=${hide.id}`;
  } catch (err) {
    if (note) note.textContent = err.message || 'เปิดที่ซ่อนไม่สำเร็จ';
    button.disabled = false;
  }
});
loadMarkers();
</script>
</body>
</html>
