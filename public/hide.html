<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hide | Meccha Chameleon</title>
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  } }</script>
  <style>
    * { box-sizing: border-box; } html, body { margin:0; width:100%; height:100%; overflow:hidden; position:fixed; overscroll-behavior:none; background:#f5f5f3; color:#16181a; font:15px system-ui,sans-serif; }
    #ar { position:fixed; inset:0; } #hud { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:14px; }
    .top, .panel { pointer-events:auto; background:rgba(255,255,255,.94); border:1px solid #e2e3df; border-radius:8px; box-shadow:0 5px 18px rgba(16,18,20,.18); }
    .top { align-self:stretch; display:flex; gap:10px; align-items:center; padding:9px 12px; } #status { flex:1; color:#3a4146; } .panel { align-self:center; width:min(520px,100%); padding:12px; display:grid; gap:10px; }
    button, a.button, input, select { pointer-events:auto; font:inherit; } button, a.button { border:1px solid transparent; border-radius:6px; min-height:40px; padding:0 13px; background:#e44a24; color:white; font-weight:700; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; } button.secondary, a.secondary { background:#ffffff; border-color:#d2d4cf; color:#16181a; } button:disabled { opacity:.5; } .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .controls button, .controls a.button { flex:1; }
    label { display:grid; grid-template-columns:72px 1fr; align-items:center; gap:9px; color:#3a4146; } input[type=range] { width:100%; accent-color:#e44a24; }
    select { min-height:34px; border:1px solid #d2d4cf; border-radius:4px; background:#ffffff; color:#16181a; padding:0 6px; }
    .place-grid { display:grid; grid-template-columns:56px 1fr auto; gap:10px 9px; align-items:center; } .place-grid #lock { grid-column:3; grid-row:2 / span 2; align-self:center; } .place-grid #pose-row { grid-column:2 / -1; } .place-grid #fit { grid-column:1 / -1; } .pose-row { display:flex; gap:9px; }
    .place-grid .row-label { font:600 14px system-ui,sans-serif; color:#3a4146; } .place-grid label.stacked { display:block; color:#3a4146; font:600 14px system-ui,sans-serif; }
    .pose-glyph { width:17px; height:17px; background:currentColor; -webkit-mask:var(--thumb) center/contain no-repeat; mask:var(--thumb) center/contain no-repeat; } .pose { width:34px; height:34px; min-height:34px; padding:0; border-radius:8px; background:#fff; border:1px solid #d2d4cf; color:#5f6870; } .pose[aria-pressed=true] { background:#e44a24; border-color:transparent; color:#fff; }
    .swatches { display:grid; grid-template-columns:auto 1fr; gap:6px 9px; align-items:center; } .swatch-row { display:flex; gap:7px; flex-wrap:wrap; min-height:30px; } .row-label { color:#5f6870; font-size:13px; white-space:nowrap; }
    /* Zone swatches lost their row label, so they span both grid columns
       instead of dropping into the narrow label column. */
    #palette-zone { grid-column:1/-1; }
    .swatch { min-height:30px; width:30px; padding:0; border:2px solid rgba(22,24,26,.28); } .swatch[aria-pressed=true] { outline:2px solid #16181a; } #palette-note { grid-column:1/-1; color:#a35c00; font-size:13px; }
    #current-color { width:28px; height:28px; border-radius:50%; border:2px solid rgba(22,24,26,.28); flex:0 0 auto; } #tool[aria-pressed=true] { background:#e44a24; border-color:transparent; color:white; outline:2px solid #16181a; }
    [data-mode=PLACE] .paint-only, [data-mode=PLACE] .review-only, [data-mode=PAINT] .place-only, [data-mode=PAINT] .review-only, [data-mode=REVIEW] .place-only, [data-mode=REVIEW] .paint-only { display:none; }
    #share { color:#16181a; display:grid; gap:8px; } #share p { margin:0; } #share input { width:100%; min-height:38px; border:1px solid #d2d4cf; border-radius:4px; background:#ffffff; color:#16181a; padding:7px 9px; } #share a { color:#b23718; } #share .share-status { color:#5f6870; font-size:13px; min-height:1.3em; } .spinner { width:16px; height:16px; border:2px solid rgba(22,24,26,.22); border-top-color:#16181a; border-radius:50%; animation:spin .75s linear infinite; } .hidden { display:none; } @keyframes spin { to { transform:rotate(360deg) } }
  </style>
</head>
<body><div id="ar"></div><div id="hud" data-mode="PLACE">
  <div class="top"><span id="spinner" class="spinner hidden"></span><span id="status">Preparing marker…</span><button id="start" type="button" disabled>Start camera</button></div>
  <section class="panel">
    <div class="place-only place-grid"><span class="row-label">Pose</span><div id="pose-row" class="pose-row"><!-- 4 buttons, built in JS --></div><label class="stacked" for="scale">Scale</label><input id="scale" type="range" min="0.08" max="1.2" step="0.01" value="0.30"><label class="stacked" for="rotate">Rotate</label><input id="rotate" type="range" min="-180" max="180" step="1" value="0"><button id="lock" type="button">Lock Position</button><span id="fit"></span></div>
    <div class="paint-only">
      <div class="swatches">
        <span class="row-label">สีเด่น</span><div id="palette" class="swatch-row"></div>
        <div id="palette-zone" class="swatch-row"></div>
        <span class="row-label">ที่ดูดมา</span><div id="palette-picked" class="swatch-row"></div>
        <span id="palette-note"></span>
      </div>
      <div class="controls"><span id="current-color" aria-hidden="true"></span><button id="tool" class="secondary" type="button" aria-pressed="false">ดูดสี</button><label>Brush <input id="brush-size" type="range" min="4" max="52" value="16"></label><label>Edge <select id="brush-edge"><option value="hard">Hard</option><option value="soft">Soft</option></select></label></div>
      <button id="review" type="button">Review</button>
    </div>
    <div class="review-only controls"><button id="peek" class="secondary" type="button">Hide silhouette</button><button id="edit" class="secondary" type="button">Edit paint</button><button id="save" type="button">Save hide</button></div>
    <div id="share"></div>
  </section>
</div><script type="module" src="/js/hide/hideApp.js"></script></body></html>
